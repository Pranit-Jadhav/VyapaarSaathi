name: Backend CI/CD

on:
  push:
    branches:
      - backend
  pull_request:
    branches:
      - backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Lint with ruff
        run: |
          ruff check .
          
      - name: Run tests
        run: |
          pytest -q
